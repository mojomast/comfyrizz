# Include inside the existing comfy.rizz.click TLS server, after validating the
# deployment. The listener on 4325 is the guest listener, never the admin one.
# Access logging is disabled for all proxied paths: invite URLs, media tickets,
# and some legacy API query strings can contain bearer credentials.

location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /secretfriendsdemo/\nDisallow: /hosted-demo/\n";
}

location = /hosted-demo {
    access_log off;
    error_log /dev/null crit;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    return 308 /hosted-demo/;
}

location ^~ /secretfriendsdemo/ {
    access_log off;
    error_log /dev/null crit;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://127.0.0.1:4325;
}

location ^~ /hosted-demo/ {
    access_log off;
    error_log /dev/null crit;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://127.0.0.1:4325;
}

location ^~ /api/ {
    access_log off;
    error_log /dev/null crit;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://127.0.0.1:4325;
}
