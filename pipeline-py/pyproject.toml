[project]
name = "comfyrizz-pipeline"
version = "0.1.0"
description = "Comfyrizz pipeline: comfy-sdk runner, attempt records and manifest (WS-B, owner Hermes)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["comfyrizz_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
