<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>hero-subject sample: a lit figure on a dark ground</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2440"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
  </defs>
  <!-- layer 0: far ground -->
  <rect id="layer-far" x="0" y="0" width="1600" height="900" fill="#0d0f14"/>
  <!-- layer 1: mid haze -->
  <rect id="layer-mid" x="0" y="300" width="1600" height="600" fill="url(#sky)"/>
  <!-- layer 2: the subject's glow -->
  <circle id="glow" cx="1040" cy="430" r="260" fill="#6d8cff"/>
  <!-- layer 3: the subject, nearest -->
  <g id="subject">
    <rect id="subject-torso" x="960" y="380" width="160" height="300" rx="36" fill="#e6e8ee"/>
    <circle id="subject-head" cx="1040" cy="320" r="78" fill="#e6e8ee"/>
    <rect id="subject-arm" x="840" y="430" width="130" height="34" rx="17" fill="#e6e8ee"/>
  </g>
  <!-- quiet area for the headline, deliberately empty and low contrast -->
  <rect id="text-safe" x="60" y="80" width="620" height="240" fill="#0d0f14" opacity="0"/>
</svg>
